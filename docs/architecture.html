<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Cal/Val Agent 架构图</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #020617;
    font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Microsoft YaHei", monospace;
  }
  .wrap { width: 1800px; padding: 28px 0 34px; }
  .head { padding: 0 60px 18px; }
  .head h1 {
    margin: 0;
    font-size: 26px;
    color: #e2e8f0;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .head .sub {
    margin-top: 8px;
    font-size: 13px;
    color: #64748b;
  }
  .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #34d399;
    margin-right: 10px;
    vertical-align: 1px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, .6); }
    70%  { box-shadow: 0 0 0 12px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }
  .card {
    margin: 0 60px;
    background: #0b1220;
    border: 1px solid #1e293b;
    border-radius: 14px;
    padding: 10px;
  }
  svg { display: block; }
  .foot {
    padding: 16px 60px 0;
    font-size: 11px;
    color: #475569;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><span class="dot"></span>Cal/Val Agent · 系统架构</h1>
    <div class="sub">LangGraph 驱动的卫星高度计定标验证智能体 · 8 节点工作流 · 4 类定标算子</div>
  </div>

  <div class="card">
    <svg width="1780" height="1120" viewBox="0 0 1780 1120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
        </marker>
        <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
        </marker>
        <marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
          <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
        </marker>
      </defs>

      <rect x="0" y="0" width="1780" height="1120" fill="#020617"/>
      <rect x="0" y="0" width="1780" height="1120" fill="url(#grid)"/>

      <!-- ══════════ 连线（先画，压在盒子下面） ══════════ -->
      <!-- UI -> data_discovery -->
      <line x1="330" y1="205" x2="330" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
      <line x1="760" y1="205" x2="760" y2="252" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

      <!-- row1: DD -> JE -> TP -> KB -->
      <line x1="390" y1="300" x2="428" y2="300" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>
      <line x1="720" y1="300" x2="758" y2="300" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>
      <line x1="1050" y1="300" x2="1088" y2="300" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>

      <!-- KB -> MR (down) -->
      <line x1="1235" y1="330" x2="1235" y2="378" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>

      <!-- row2 right->left: MR -> PF -> UC -> EO -->
      <line x1="1088" y1="430" x2="1050" y2="430" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>
      <line x1="758" y1="430" x2="720" y2="430" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>
      <line x1="428" y1="430" x2="390" y2="430" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>

      <!-- EO -> 算子层 -->
      <line x1="245" y1="460" x2="245" y2="640" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowG)"/>
      <!-- EO -> 知识库 (write, dashed) -->
      <path d="M 300 460 L 300 600 L 1600 600 L 1600 470" fill="none" stroke="#a78bfa"
            stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arrowV)"/>
      <!-- KB -> 知识库 (read, dashed) -->
      <line x1="1380" y1="300" x2="1478" y2="300" stroke="#a78bfa" stroke-width="1.6"
            stroke-dasharray="6,5" marker-end="url(#arrowV)"/>

      <!-- data_discovery -> 数据适配层 -->
      <line x1="1420" y1="330" x2="1560" y2="330" stroke="#64748b" stroke-width="1.4"
            stroke-dasharray="4,4" marker-end="url(#arrow)"/>
      <path d="M 1560 330 L 1560 830 L 1420 830" fill="none" stroke="#64748b"
            stroke-width="1.4" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

      <!-- ══════════ 层级 1：用户界面层 ══════════ -->
      <rect x="60" y="110" width="1380" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="84" y="138" fill="#64748b" font-size="12" letter-spacing="1">用户界面层</text>

      <rect x="120" y="152" width="420" height="56" rx="6" fill="#0f172a"/>
      <rect x="120" y="152" width="420" height="56" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="140" y="176" fill="#e2e8f0" font-size="13">Web 界面</text>
      <text x="140" y="194" fill="#7dd3fc" font-size="9">web/server.py · index.html · app.js</text>

      <rect x="600" y="152" width="320" height="56" rx="6" fill="#0f172a"/>

      <!-- row2 (right to left) -->
      <g>

        <text x="778" y="425" fill="#e2e8f0" font-size="12">param_fill</text>
        <text x="778" y="443" fill="#6ee7b7" font-size="9">参数体填充 · LLM 微调</text>
      </g>
      <g>
        <rect x="430" y="402" width="290" height="56" rx="6" fill="#0f172a"/>
        <rect x="430" y="402" width="290" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>

        <text x="448" y="443" fill="#6ee7b7" font-size="9">确认 / 自然语言改参</text>
      </g>
      <g>
        <rect x="100" y="402" width="290" height="56" rx="6" fill="#0f172a"/>
        <rect x="100" y="402" width="290" height="56" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="118" y="425" fill="#e2e8f0" font-size="12">execute_operator</text>
        <text x="118" y="443" fill="#6ee7b7" font-size="9">MATCH → CAL · 写知识库</text>
      </g>

      <!-- ══════════ 层级 3：算子包装器层 ══════════ -->

      <g>
        <rect x="100" y="682" width="310" height="56" rx="6" fill="#0f172a"/>

      </g>
      <g>
        <rect x="440" y="682" width="310" height="56" rx="6" fill="#0f172a"/>

        <text x="458" y="723" fill="#6ee7b7" font-size="9">星自交叉 · 单星漂移</text>
      </g>
      <g>
        <rect x="780" y="682" width="310" height="56" rx="6" fill="#0f172a"/>

      </g>
      <g>
        <rect x="1120" y="682" width="310" height="56" rx="6" fill="#0f172a"/>

        <text x="1138" y="723" fill="#6ee7b7" font-size="9">验潮站外推 · 绝对基准</text>
      </g>

      <!-- ══════════ 层级 4：数据适配层 ══════════ -->
      <rect x="60" y="800" width="1380" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="84" y="828" fill="#64748b" font-size="12" letter-spacing="1">数据适配层</text>

      <g>
        <rect x="120" y="842" width="560" height="52" rx="6" fill="#0f172a"/>

      </g>
      <g>
        <rect x="760" y="842" width="560" height="52" rx="6" fill="#0f172a"/>
        <rect x="760" y="842" width="560" height="52" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="780" y="864" fill="#e2e8f0" font-size="12">IPFUtils.MyIPFConfig</text>
        <text x="780" y="882" fill="#cbd5e1" font-size="9">XML 工单解析 · 日志 · product.xml 生成</text>
      </g>

      <!-- ══════════ 右侧：知识库 / 数据 / 输出 ══════════ -->
      <g>
        <rect x="1478" y="240" width="250" height="120" rx="10" fill="#0f172a"/>
        <rect x="1478" y="240" width="250" height="120" rx="10" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.6"/>
